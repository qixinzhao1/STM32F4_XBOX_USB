##########################################################################################
#                        Append Compiler Options For Source Files
##########################################################################################

# syntax:
#   <your pattern>: <compiler options>
# For get pattern syntax, please refer to: https://www.npmjs.com/package/micromatch
#
# examples:
#   'main.cpp':           --cpp11 -Og ...
#   'src/*.c':            -gnu -O2 ...
#   'src/lib/**/*.cpp':   --cpp11 -Os ...
#   '!Application/*.c':   -O0
#   '**/*.c':             -O2 -gnu ...

version: "2.1"
options:
    Debug:
        files:
            'Lib_OS/Src/*.c': '-Wextra -Werror -Wshadow -Wconversion'
            'Lib_App/Src/*.c': '-Wextra -Werror -Wshadow -Wconversion'
            'Lib_Mid/Src/*.c': '-Wextra -Werror -Wshadow -Wconversion'
            'Lib_BSP/Src/*.c': '-Wextra -Werror -Wshadow -Wconversion'
    Release:
        files:
            'Lib_OS/Src/*.c': '-Wextra -Werror -Wshadow -Wconversion'
            'Lib_App/Src/*.c': '-Wextra -Werror -Wshadow -Wconversion'
            'Lib_Mid/Src/*.c': '-Wextra -Werror -Wshadow -Wconversion'
            'Lib_BSP/Src/*.c': '-Wextra -Werror -Wshadow -Wconversion'
